# Проєкт генерується XcodeGen: `xcodegen generate` у цій папці. .xcodeproj вручну не редагувати.
name: StoneNavigationEmulation
options:
  deploymentTarget:
    iOS: "27.0"
  developmentLanguage: uk
  createIntermediateGroups: true
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
packages:
  NavigationCore:
    path: NavigationCore
targets:
  StoneNavigationEmulation:
    type: application
    platform: iOS
    sources:
      - path: StoneNavigationEmulation
      - path: NavigationCore/Tests/NavigationCoreTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - package: NavigationCore
    info:
      path: StoneNavigationEmulation/Info.plist
      properties:
        CFBundleDisplayName: Stone Nav
        CFBundleDevelopmentRegion: uk
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - location
          - audio
        NSLocationWhenInUseUsageDescription: "Позиція потрібна, щоб вести вас маршрутом і помічати, коли GPS зник або його підмінили."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Дозвіл «Завжди» потрібен, щоб навігація і голосові підказки працювали з вимкненим екраном і у фоні."
        NSMotionUsageDescription: "Датчики руху визначають стоянку та повороти, щоб точніше рухати розрахункову позицію без GPS."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).StoneNavigationEmulation
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  StoneNavigationEmulationUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: StoneNavigationEmulationUITests
    dependencies:
      - target: StoneNavigationEmulation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).StoneNavigationEmulationUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: StoneNavigationEmulation
  StoneNavigationEmulationIntegrationTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: StoneNavigationEmulationIntegrationTests
    dependencies:
      - target: StoneNavigationEmulation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).StoneNavigationEmulationIntegrationTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  StoneNavigationEmulation:
    build:
      targets:
        StoneNavigationEmulation: all
        StoneNavigationEmulationUITests: [test]
        StoneNavigationEmulationIntegrationTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      language: uk
      region: UA
      targets:
        - name: StoneNavigationEmulationUITests
          parallelizable: false
        - name: StoneNavigationEmulationIntegrationTests
          parallelizable: false
